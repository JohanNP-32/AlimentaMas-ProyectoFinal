name: CI/CD - Alimenta+ Donor Module

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas con cobertura (Jest, umbral 80%)
        run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Nota: el análisis de calidad de código se hace con SonarQube Cloud
  # (SonarCloud), conectado directamente al repositorio con "Automatic
  # Analysis". Por eso no está aquí como job del pipeline: SonarCloud no
  # permite tener el análisis automático y el análisis por CI/CD activos
  # al mismo tiempo. Las métricas (seguridad, confiabilidad, mantenibilidad,
  # duplicación) se documentan en el informe de cierre.

  deploy:
    name: Despliegue automático a entorno de prueba
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      # Aquí se conecta con el proveedor real del entorno de prueba
      # (Render, Railway, Fly.io, un VPS propio, etc.). Se deja como
      # ejemplo con Render, que es gratuito para un entorno de pruebas.
      - name: Desplegar a entorno de prueba (Render)
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}"
